name: Reproduce and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TMPDIR: ${{ github.workspace }}/.work-temp
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p "$TMPDIR"
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - run: uv sync --locked
      - run: uv run python scripts/install_reasoner.py
      - run: uv run python reproducibility/v05/reproduce.py
      - run: uv run pytest -q
      - run: uv build
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error supplementary.tex
      - uses: actions/upload-artifact@v4
        with:
          name: eq-biodt-reproduced
          path: |
            dist/
            paper/main.pdf
            paper/supplementary.pdf
            paper/figures/v05_*.pdf
            paper/tables/v05_*.tex
            reviews/v03/
            reviews/v05/
            data/v03/manifest.json
            data/v03/entailed_memberships.json
            data/v03/model_contract.json
